#JOB 1 : iac scanning and initial security 

name: DevSecOps pipeline

on:
  push:
    branches : ["main"]
  pull_request: 
    branches : ["main"]


env: 
  AWS_REGION : us-east-1
  ECR_REPOSITORY : aegis-ai-agent


jobs: 
  iac-and-static-scan:
    name: Infrastructure (IaC) & code security 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0 #pour installer all the commits


      - name: check for git leaks
        uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Scan de IaC (terraform configutations)
        uses: aquasecurity/trivy-action@master
        with: 
          scan-type: 'config'
          hide-progress: true 
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: SAST (sonarcloud scan)
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=noolatifa_ai-defense-devsecops
            -Dsonar.organization=noolatifa



  # JOB 2 : secure build, container scan & aws push

  build-scan-and-push:
    name: Secure Docker Build, Trivy Container Scan & AWS ECR Push
    runs-on: ubuntu-latest
    needs: iac-and-static-scan    # if sast or iac scan fails we BLOCKKKKK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker buildx   
        uses: docker/setup-buildx-action@v3      #docker buildx est une version amelioree de docker, build rapide, parralele des couches, multi architecture (amd, arm, etc) et moderne!

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
          aws-region: ${{ env.AWS_REGION }}



      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .


      - name: Trivy Container Scanner
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


      - name: Push to Amazon ECR 
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

